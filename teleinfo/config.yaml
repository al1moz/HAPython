
---
name: HAPython TeleInfo
version: "0.0.3.4"
slug: hapython-teleinfo
description: Python Téléinfo Add-ons
url: https://github.com/al1moz/HAPython/teleinfo
codenotary: notary@home-assistant.io
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
host_network: true
devices:
  - /dev/ttyUSB2:/dev/ttyUSB2
  - /dev/ttyUSB1:/dev/ttyUSB1
  - /dev/ttyUSB0:/dev/ttyUSB0
options:
  port_usb: "/dev/ttyUSB21"
  token_influxdb: ""
  url_influxdb: "http://192.168.x.x:8086"
schema:
  port_usb: str
  token_influxdb: str
  url_influxdb: str
map:
  - config:rw